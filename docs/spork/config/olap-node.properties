# SPORK day-1 configuration: OLAP NODE (n4; Q1 shape: voter with HA_SERVER_ROLE=replica, priority 0; analytics, batch,
# offline builds, dossier footprints and hydrates, set-scoped graph and geo analysis, full-text over the df gate)
#
# DELTA FILE: apply read-node.properties first, then these keys override or add to it. Sources: 01-architecture.md 1.4
# (n4 column), 1.1, 3.6 E0; 02-retrieval-speed.md C6, C12, 5.2 header, 5.4 closing paragraph.

# ---------------------------------------------------------------------------------------------------------------
# Role
# ---------------------------------------------------------------------------------------------------------------
# HA_SERVER_ROLE, SCOPE.SERVER, String, allowed {any, replica}, default any. "replica" sets the Raft peer priority to 0:
# n4 is the last choice for leader, NOT excluded. It stays a voter; while no higher-priority peer can be elected (n1 down
# or restarting, and every other live peer also priority 0) the priority-0 peers elect one of themselves, and leadership
# moves back once a higher-priority peer is up and caught up (incident 2026-11-12: a replica was elected while the
# priority-10 node restarted). Give n2/n3 a priority between (the serverList entry's priority field) so they, not n4,
# lead in that window. A node that is never elected needs the non-voting "listener" role, E4 (Q3 to Q4). [E0, 1.1]
arcadedb.ha.serverRole=replica

# ---------------------------------------------------------------------------------------------------------------
# Page cache: 4 GB of a 43 GB heap (1.4 n4 column: 4 + 8 + 7 + 16 + 8 = 43)
# ---------------------------------------------------------------------------------------------------------------
# MAX_PAGE_RAM, SCOPE.DATABASE, Long MB, default 4096. 4 GB = 4096 MB (the compiled-in default, set for explicitness).
# 4096 / 44032 MB (43 GB heap) = 9%, under the 80% clamp. n4 takes dossier footprints and set-scoped hydrates (P9c, P11;
# 1.4 and D52, round 6): with HASH point lookups the resident index tops are under 0.25 GB plus about 1.3 GB of LSM
# composite tops at 3x, and a 2,000-id hydrate moves 112 MB = 2.8% of this cache. [1.4, 5.4, 2.0]
arcadedb.maxPageRAM=4096
# INITIAL_PAGE_CACHE_SIZE, SCOPE.DATABASE, Integer, default 65535. NOT STATED FOR n4 in either doc; derived by scaling
# the n1 to n3 value by cache size: 2000000 x 4 / 23 = 347,826, rounded up to 400000 so the map never resizes. [3.1, derived]
arcadedb.initialPageCacheSize=400000

# ---------------------------------------------------------------------------------------------------------------
# Planner and parallel scans: "n4 keeps the parallel defaults" (C6) and the default selectivity (C12)
# ---------------------------------------------------------------------------------------------------------------
# QUERY_INDEX_MAX_SELECTIVITY, SCOPE.DATABASE, Float, default 0.6. Wide aggregations should use all cores. [C12, 5.4]
arcadedb.queryIndexMaxSelectivity=0.6
# QUERY_PARALLELISM_POOL_THREADS, SCOPE.JVM, Integer, default 0 = available cores (min 2). [C6: n4 keeps the defaults]
arcadedb.queryParallelismPoolThreads=0
# PARALLEL_SCAN_PRODUCER_POOL_THREADS, SCOPE.JVM, Integer, default 0 = available cores (min 2). [C6]
arcadedb.parallelScanProducerPoolThreads=0
# QUERY_PARALLEL_SCAN_PAGES_PER_UNIT, SCOPE.DATABASE, Integer, default 32. [C6: parallel defaults]
arcadedb.queryParallelScanPagesPerUnit=32
# QUERY_SCAN_READ_AHEAD_MAX_RAM, SCOPE.JVM, Long MB, default 200. [C6: parallel defaults]
arcadedb.queryScanReadAheadMaxRAM=200

# ---------------------------------------------------------------------------------------------------------------
# Everything else is inherited from read-node.properties. In particular n4 keeps:
#   httpWorkerThreads=96, httpIoThreads=8, queryMaxConcurrent=48, queryQueueMaxSize=64, queryQueueTimeout=2000,
#   command.timeout=30000 (C6 names only the parallel keys as "defaults" on n4), the compaction keys, the HA keys,
#   vectorIndex.searchCacheSize=500000 (1.4: the 8 GB vector slice is the same on n4), polyglotEngineEnabled=false.
#   No asyncWorkerThreads: n4 is a follower and never creates the async pool (C6).
# ---------------------------------------------------------------------------------------------------------------

# ---------------------------------------------------------------------------------------------------------------
# Build slice (n4 only, 1.4): a SEPARATE embedded JVM for GraphBatch backfills and hot-to-warm txt rewrites, 16 GB.
# These are that JVM's settings, not the server's:
#   -Xmx12g, plus about 2 GB native and 2 GB direct = 16 GB
#   arcadedb.maxPageRAM=4096                 (4 GB page cache, 1.4)
#   GraphBatch ... withWAL(true)             (1.4 round 5: withWAL(false) retains about 8 KB of heap per record)
#   arcadedb.ha.* not applicable (embedded, no Raft); the result is admitted as a backfill under the aging protocol (3.5)
# ---------------------------------------------------------------------------------------------------------------
