# SPORK day-1 configuration: LEADER NODE (n1; priority 10 voter: writes, ingest, audit appends, leased jobs, light reads)
#
# DELTA FILE: apply read-node.properties first, then these keys override or add to it. Everything not listed here is
# identical to the read node (01-architecture.md 1.4 gives n1 to n3 the same RAM budget; 02-retrieval-speed.md 5.2 and
# 5.4 give n1 to n3 the same flags and settings). Same delivery mechanism as read-node.properties (ARCADEDB_SETTINGS or
# config/server-configuration.json; the SCOPE.DATABASE keys via ALTER DATABASE).

# ASYNC_WORKER_THREADS, SCOPE.DATABASE, Integer, default = available cores - 1 (31 on 32 cores). The async pool is
# created lazily by LocalDatabase.async(), so only the node that runs async writes (ingest, GraphBatch) ever has one;
# 2 keeps it from taking cores the interactive readers and the Raft apply thread need. [C6, 5.4]
arcadedb.asyncWorkerThreads=2

# HA_SERVER_ROLE, SCOPE.SERVER, String {any, replica}, default any. The leader must be electable: keep the default. [1.1]
# arcadedb.ha.serverRole=any

# Everything else that differs on the leader is NOT a GlobalConfiguration key:
#
# - Raft peer priority 10 (n1) vs 5 (n2, n3) vs 0 (n4): 1.1. Set in the HA peer/priority configuration, not in
#   GlobalConfiguration (HA_SERVER_ROLE only knows "any" and "replica").
# - LSMTreeIndexCompactor runs only on the leader (RaftReplicatedDatabase.runWithCompactionReplication returns false on
#   followers, 0.4), so the compaction keys of read-node.properties take effect HERE and ship compacted pages through the
#   Raft log. Keep arcadedb.indexCompactionFullSeriesThreshold=0 and arcadedb.indexCompactionFullDeadEntriesRatio=0 on
#   every database; full compactions are plugin jobs under the transient-slot lease (0.4, C5 since round 6). The HASH
#   point-lookup indexes never compact (HashIndex.compact() returns false).
# - Auto backup (E0, 0.4): runs on $leader. Configured in config/backup.json (server/backup/AutoBackupConfig), not in
#   GlobalConfiguration: {"enabled": true, "backupDirectory": "<off-node encrypted mount, outside databases/>",
#   "defaults": {"schedule": {"type": "interval", "frequencyMinutes": 1440}, "retention": {"maxFiles": 7}},
#   "databases": {<identity, ops, audit, recdir, current rec_<p>, txt_<p>, media_<p> enabled; every sealed database
#   "enabled": false>}}. Field names from AutoBackupConfig.fromJSON / DatabaseBackupConfig.fromJSON (enabled,
#   runOnServer, schedule{type, frequencyMinutes, expression, timeWindow}, retention{maxFiles, tiered}, compressionLevel,
#   compressionThreads, maxMBPerSecond). The stock archives are plaintext (BackupTask never sets an encryption key), so
#   the mount itself must be encrypted with KMS-held keys (5.6).
#   arcadedb.server.backupDirectory (SERVER_BACKUP_DIRECTORY, SCOPE.JVM, default ${arcadedb.server.rootPath}/backups)
#   is the server-level default for the same directory; point both at the mount.
# - Interactive reads are routed to n2/n3 with weight 3 and to n1 with weight 1 (2.0); that is the L7 balancer's
#   configuration, not the server's.
# - Governed writes and audit appends are pinned to the leader through the plugin's internal route (3.1 of the
#   architecture); the leader therefore also receives the X-ArcadeDB-Read-Consistency: linearizable audit pages, which
#   on the leader cost no ReadIndex RPC.
