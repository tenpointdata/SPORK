# SPORK day-1 configuration: READ NODE (n2, n3; interactive-read voters)
#
# Sources: docs/spork/02-retrieval-speed.md 4.1 (C1-C12), 5.4; docs/spork/01-architecture.md 1.4, 3.6 E0, 0.4, 1.1.
# Every key below was checked against engine/src/main/java/com/arcadedb/GlobalConfiguration.java (key string,
# enum constant, scope, compiled-in default). "default X" in a comment is the compiled-in default.
#
# HOW THIS FILE IS APPLIED. The server has no .properties loader (the "arcadedb-server.properties" named in
# 02-retrieval-speed.md 5.4 does not exist as a file format). GlobalConfiguration.readConfiguration() reads each key
# as a JVM system property, then as an environment variable of the same name; bin/server.sh passes $ARCADEDB_SETTINGS
# verbatim on the java command line. Either:
#   export ARCADEDB_SETTINGS="$(grep -v '^#' read-node.properties | grep '=' | sed 's/^/-D/' | tr '\n' ' ')"
# or copy the SCOPE.SERVER/JVM keys into config/server-configuration.json (ArcadeDBServer.loadConfiguration ->
# ContextConfiguration.fromJSON). SCOPE.DATABASE keys given here become the JVM-wide default for every database;
# the per-database overrides are listed at the bottom and are applied with ALTER DATABASE (see schema-ddl.sql).

# ---------------------------------------------------------------------------------------------------------------
# Page cache (3.1, 1.4, 5.4)
# ---------------------------------------------------------------------------------------------------------------
# MAX_PAGE_RAM, SCOPE.DATABASE (read JVM-wide by PageManager.configure, C1), Long MB, default 4096. 23 GB = 23 x 1024.
# 23552 MB / 57344 MB (56 GB heap) = 41%, under the 80%-of-heap clamp at GlobalConfiguration.java:178-200. [1.4, 3.1, 5.4]
arcadedb.maxPageRAM=23552
# INITIAL_PAGE_CACHE_SIZE, SCOPE.DATABASE, Integer, default 65535. About 800K slots of 32 KB/16 KB pages fit in 23 GB;
# 2M entries so the ConcurrentHashMap never resizes under load. [3.1, 5.4]
arcadedb.initialPageCacheSize=2000000
# FREE_PAGE_RAM, SCOPE.DATABASE, Integer percent, default 50. LEFT AT DEFAULT ON PURPOSE: a lower value makes the
# whole-cache copy-and-sort eviction run MORE frequent (period = maxRAM x freePageRAM / miss bandwidth). [C1, 3.1]
# arcadedb.freePageRAM=50

# ---------------------------------------------------------------------------------------------------------------
# Page sizes for objects created without an explicit size (C9, 2.0, 5.4). Fixed at creation; existing files keep theirs.
# ---------------------------------------------------------------------------------------------------------------
# INDEX_DEFAULT_PAGE_SIZE, SCOPE.DATABASE, Integer bytes, default 262144. Applies only to plain LSM_TREE indexes
# (IndexBuilder.getLsmTreePageSize); FULL_TEXT, GEOSPATIAL and vector indexes ignore it (see schema-ddl.sql). [C9]
arcadedb.indexDefaultPageSize=65536
# BUCKET_DEFAULT_PAGE_SIZE, SCOPE.DATABASE, Integer bytes, default 65536. 32 KB = 40 Record rows per page, 75% density
# (a v0 page spends 8,202 B on header + slot table). recdir and identifier vertices use 16 KB via CREATE TYPE ... PAGESIZE. [C9, 2.0]
# Round 6: HASH indexes take HashIndexBucket.defaultPageSize (4 KB fixed-width keys, 16 KB STRING/BINARY) from plain SQL;
# no setting and no Java builder for them (01-architecture.md 0.4, 02 C9).
arcadedb.bucketDefaultPageSize=32768
# EXTERNAL_PROPERTY_BUCKET_DEFAULT_PAGE_SIZE, SCOPE.DATABASE, Integer bytes, default 262144. The docs set 16384 ONLY on
# txt_<p> before the EXTERNAL text property exists (E0, 0.4); per database, so it is in schema-ddl.sql, not here.
# arcadedb.externalPropertyBucketDefaultPageSize=16384   (per txt_<p>, ALTER DATABASE)
# TYPE_DEFAULT_BUCKETS, SCOPE.DATABASE, Integer, default 1. One bucket per type is already the default. [2.0]
# arcadedb.typeDefaultBuckets=1

# ---------------------------------------------------------------------------------------------------------------
# LSM compaction policy (01-architecture.md 0.4 / E0; 02-retrieval-speed.md C5 carries the same policy since round 6)
# ---------------------------------------------------------------------------------------------------------------
# INDEX_COMPACTION_MIN_PAGES_SCHEDULE, SCOPE.DATABASE, Integer, default 10. 64: each incremental round appends one series, so
# fewer, larger rounds keep a live composite at about 56 series a week at 3x pace (892 at 4) and cut the per-round Raft
# overhead; the cost is up to 64 mutable-page binary searches per cursor open on the live partition (M2/M6 remove it).
# Moot on sealed partitions (no mutable pages after the seal compaction). Round 6 decision, 01 0.4 / E0, 02 C5. [E0, C5]
arcadedb.indexCompactionMinPagesSchedule=64
# INDEX_COMPACTION_FULL_SERIES (key string differs from the constant name), SCOPE.DATABASE, Integer, default 10.
# 0 = no automatic full compaction, on EVERY database (round 6: 02 C5's 3 on identity was rejected; it is a no-op on the
# tiny identity indexes and an unbounded rewrite of the growing ones such as the AuditEntry composites). Full compactions
# are leased plugin jobs: every LSM index at seal and after admission, weekly for the current FULL_TEXT and identity. [E0, C5]
arcadedb.indexCompactionFullSeriesThreshold=0
# INDEX_COMPACTION_FULL_DEAD_ENTRIES_RATIO, SCOPE.DATABASE, Float, default 1.0. 0 disables the second trigger of an
# automatic full compaction (dead-key ratio, "whatever the series count"); without it threshold=0 alone does not stop
# full rewrites from shipping through the Raft log. [E0, 0.4]
arcadedb.indexCompactionFullDeadEntriesRatio=0
# INDEX_BLOOM_FILTER_RATE, SCOPE.DATABASE, Float, default 0.01 (enabled). Left at default: not a lever. [C5, 3.6]
# arcadedb.indexBloomFilterRate=0.01
# INDEX_COMPACTION_RAM_MB, SCOPE.DATABASE, Long MB, default 300. Not named by the docs; left at default.

# ---------------------------------------------------------------------------------------------------------------
# Statement and plan caches, literal parameterization, result ceiling (C4, 5.4)
# ---------------------------------------------------------------------------------------------------------------
# QUERY_LITERAL_PARAMETERIZATION, SCOPE.DATABASE, Boolean, default true (already the default; set for explicitness). [C4]
arcadedb.queryLiteralParameterization=true
# SQL_STATEMENT_CACHE, SCOPE.DATABASE, Integer, default 300. [C4]
arcadedb.sqlStatementCache=2000
# OPENCYPHER_STATEMENT_CACHE, SCOPE.DATABASE, Integer, default 300. [C4]
arcadedb.opencypher.statementCache=2000
# OPENCYPHER_PLAN_CACHE, SCOPE.DATABASE, Integer, default 300. [C4]
arcadedb.opencypher.planCache=2000
# SERVER_HTTP_QUERY_MAX_RESULT_ROWS, SCOPE.SERVER, Integer, default 1000000. HTTP 413 above it; NDJSON for >100 rows. [C4]
arcadedb.server.httpQueryMaxResultRows=2000
# QUERY_INDEX_MAX_SELECTIVITY, SCOPE.DATABASE, Float, default 0.6. 0 = never abandon an index search for a scan
# (0.6 / ((1 + 8) / 2) = 13% with 8 scan producers would turn a capped count into a 0.5 to 5 s scan). n4 keeps 0.6. [C12, 5.4]
arcadedb.queryIndexMaxSelectivity=0

# ---------------------------------------------------------------------------------------------------------------
# Thread budget on a 32-core read node (C6, 5.3, 5.4). Sum of blocking readers near 128 so the NVMe queue (QD 32) stays full.
# ---------------------------------------------------------------------------------------------------------------
# SERVER_HTTP_WORKER_THREADS, SCOPE.SERVER, Integer, default 500 (500 on 32 cores = 15:1 oversubscription). [C6]
arcadedb.server.httpWorkerThreads=96
# SERVER_HTTP_IO_THREADS, SCOPE.SERVER, Integer, default 0 = available cores. [C6]
arcadedb.server.httpIoThreads=8
# QUERY_MAX_CONCURRENT, SCOPE.JVM, Integer, default 0 = max(4, 2 x cores). Admission gate for remote requests. [C6]
arcadedb.queryMaxConcurrent=48
# QUERY_QUEUE_MAX_SIZE, SCOPE.JVM, Integer, default 256. Keep below httpWorkerThreads (each waiter parks a worker). [C6]
arcadedb.queryQueueMaxSize=64
# QUERY_QUEUE_TIMEOUT, SCOPE.JVM, Long ms, default 30000. Fail fast with 503 under burst, p99 stays flat. [C6]
arcadedb.queryQueueTimeout=2000
# QUERY_PARALLELISM_POOL_THREADS, SCOPE.JVM, Integer, default 0 = cores (min 2). [C6]
arcadedb.queryParallelismPoolThreads=12
# PARALLEL_SCAN_PRODUCER_POOL_THREADS, SCOPE.JVM, Integer, default 0 = cores (min 2). W = 8 in the C12 arithmetic. [C6]
arcadedb.parallelScanProducerPoolThreads=8
# QUERY_PARALLEL_SCAN_PAGES_PER_UNIT, SCOPE.DATABASE, Integer, default 32. Single-bucket types split by page range. [C6, 2.0]
arcadedb.queryParallelScanPagesPerUnit=256
# QUERY_SCAN_READ_AHEAD_MAX_RAM, SCOPE.JVM, Long MB, default 200. [C6]
arcadedb.queryScanReadAheadMaxRAM=512
# COMMAND_TIMEOUT, SCOPE.DATABASE, Long ms, default 0 (unbounded). [C6]
arcadedb.command.timeout=30000
# SERVER_HTTP_TERMINATE_ON_CLIENT_DISCONNECT, SCOPE.SERVER, Boolean, default true. [C6]
arcadedb.server.httpTerminateOnClientDisconnect=false
# POLYGLOT_ENGINE_ENABLED, SCOPE.JVM, Boolean, default true. No GraalVM engine on a read node. [C6]
arcadedb.polyglotEngineEnabled=false
# ASYNC_WORKER_THREADS, SCOPE.DATABASE, Integer, default cores - 1. NOT SET HERE: the async pool is created lazily by
# LocalDatabase.async(), so a read-only follower never has one; the leader sets 2 (leader-node.properties). [C6]
# arcadedb.asyncWorkerThreads=2
# PROFILE, SCOPE.JVM, String, default "default". NEVER "high-performance": it sets the vector caches to 50% of heap. [C6]
# arcadedb.profile=default

# ---------------------------------------------------------------------------------------------------------------
# Graph (C7, 2.1)
# ---------------------------------------------------------------------------------------------------------------
# GRAPH_SUPERNODE_THRESHOLD, SCOPE.DATABASE, Integer edges per vertex per direction, default 4096. Set BEFORE load so a
# hub stays one chain (the 16-stripe promotion costs a read 16 head-chunk loads and is one-way). [C7, 2.1]
arcadedb.graph.supernodeThreshold=1000000
# GRAPH_GHOST_EDGE_PROBE, SCOPE.DATABASE, Boolean, default true. false ONLY on sealed partitions after
# CHECK DATABASE ... FIX (per database, schema-ddl.sql); the JVM-wide default stays true. [C7]
# arcadedb.graph.ghostEdgeProbe=false   (sealed rec_<p> only, ALTER DATABASE)
# GRAPH_EDGE_LIST_INITIAL_CHUNK_SIZE, SCOPE.DATABASE, Integer bytes, default 64. The docs want 2048 on SHARED identifier
# vertices only (C7, 2.1), but LocalDatabase.getNewEdgeListSize reads the JVM-wide static value, GraphEngine has no
# per-vertex chunk-size API, and 2048 everywhere costs +85 GB per partition (2.1). Left at 64 until the engine item
# (02 4.2 S18 / 01 3.6 E24: per-type first and second chunk sizes, 0.5 to 1 ew) ships. [C7, round 6]
# arcadedb.graph.edgeListInitialChunkSize=64   (the default; 2048 needs S18/E24)

# ---------------------------------------------------------------------------------------------------------------
# Vector (C11, E0, 1.4)
# ---------------------------------------------------------------------------------------------------------------
# VECTOR_INDEX_SEARCH_CACHE_SIZE, SCOPE.DATABASE, Integer vectors, default 0 = auto (whole id range, up to
# searchCacheMaxHeapPercent of heap). 16 buckets x 0.5M x 104 B = 0.8 GB of the 8 GB vector slice. 1.1 says set it per
# txt_* with ALTER DATABASE as well (also in schema-ddl.sql); the JVM-wide value is 5.4's. [C11, 1.4, 5.4]
arcadedb.vectorIndex.searchCacheSize=500000
# VECTOR_INDEX_MAX_CONCURRENT_REBUILDS, SCOPE.JVM, Integer, default 1 (already). One 7 GB rebuild permit. [C11, E0, 1.4]
arcadedb.vectorIndex.maxConcurrentRebuilds=1
# VECTOR_INDEX_SEARCHER_POOL_SIZE, SCOPE.DATABASE, Integer, default 0 = 2 x cores. Left at default; -1 would disable pooling. [C11]
# arcadedb.vectorIndex.searcherPoolSize=0

# ---------------------------------------------------------------------------------------------------------------
# HA and replication (C2, E0, 1.1)
# ---------------------------------------------------------------------------------------------------------------
# HA_READ_CONSISTENCY, SCOPE.SERVER, String {eventual, read_your_writes, linearizable}, default read_your_writes.
# Already free for a request without a bookmark; set for explicitness. Clients send X-ArcadeDB-Read-Consistency per request. [C2]
arcadedb.ha.readConsistency=read_your_writes
# HA_AUTO_ACQUIRE_DATABASES, SCOPE.SERVER, Boolean, default true. Every database on every node (replication factor 4). [1.1]
arcadedb.ha.autoAcquireDatabases=true
# HA_SNAPSHOT_MAX_CONCURRENT, SCOPE.SERVER, Integer, default 2. One slot per follower; sized once at startup. [E0, 1.1]
arcadedb.ha.snapshotMaxConcurrent=3
# HA_SNAPSHOT_INSTALL_RETRIES, SCOPE.SERVER, Integer, default 3. [E0, 1.1]
arcadedb.ha.snapshotInstallRetries=6
# HA_SNAPSHOT_INSTALL_RETRY_BASE_MS, SCOPE.SERVER, Long ms, default 5000. 30 s x (2^0 .. 2^5) = 31.5 min total backoff. [E0, 1.1]
arcadedb.ha.snapshotInstallRetryBaseMs=30000
# HA_BOOTSTRAP_TIMEOUT_MS, SCOPE.SERVER, Long ms, default 120000. 1 h today; 5400000 (1.5 h) above 2 TB of databases. [E0, 1.1]
arcadedb.ha.bootstrapTimeoutMs=3600000
# HA_SNAPSHOT_COMPRESSION_LEVEL, SCOPE.SERVER, Integer, default 1. 0 = stored, on a dedicated 10 GbE link. [E0, 1.1]
arcadedb.ha.snapshotCompressionLevel=0
# HA_LOG_PURGE_UPTO_SNAPSHOT, SCOPE.SERVER, Boolean, default true. false permanently until E0.5 (0.6, 3.2 rule 6). [E0, 0.6]
arcadedb.ha.logPurgeUptoSnapshot=false
# HA_STALE_FOLLOWER_RECOVERY_DURATION_MS, SCOPE.SERVER, Long ms, default 60000. 30 min, above the worst admission stall. [E0, 1.1]
arcadedb.ha.staleFollowerRecoveryDurationMs=1800000
# SERVER_READINESS_REQUIRES_HA, SCOPE.SERVER, Boolean, default false. [E0]
arcadedb.server.readinessRequiresHA=true
# HA_SERVER_ROLE, SCOPE.SERVER, String {any, replica}, default any. Voters n1 to n3 keep "any". [1.1]
# arcadedb.ha.serverRole=any

# ---------------------------------------------------------------------------------------------------------------
# Network and auth (C3, 5.4, L5)
# ---------------------------------------------------------------------------------------------------------------
# NETWORK_SOCKET_TIMEOUT, SCOPE.SERVER, Integer ms, default 30000. Above the client pool's idle timeout. [5.4, L5]
arcadedb.network.socketTimeout=600000
# SERVER_SECURITY_SALT_CACHE_SIZE, SCOPE.SERVER, Integer, default 64. Only if Basic auth must stay; the rule is token auth. [C3]
# arcadedb.server.securitySaltCacheSize=1024

# ---------------------------------------------------------------------------------------------------------------
# Per-database overrides (SCOPE.DATABASE keys applied with ALTER DATABASE `key` value; full statements in schema-ddl.sql)
# ---------------------------------------------------------------------------------------------------------------
# every db:  arcadedb.indexCompactionFullSeriesThreshold=0 and ...FullDeadEntriesRatio=0   [E0, C5 (round 6): the JVM-wide values above]
# identity, current rec_<p>/txt_<p>/media_<p>: arcadedb.indexCompactionMinPagesSchedule=64   [E0; moot on sealed partitions]
# sealed rec_<p> after CHECK DATABASE ... FIX: arcadedb.graph.ghostEdgeProbe=false   [C7]
# txt_<p>:    arcadedb.externalPropertyBucketDefaultPageSize=16384 BEFORE the EXTERNAL text property   [E0, 0.4]
# txt_*:      arcadedb.vectorIndex.searchCacheSize=500000              [E0, 1.1]
# n4 only:    arcadedb.queryIndexMaxSelectivity left at 0.6             [C12]
